<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px;
            color: white;
        }

        .restaurant-name {
            font-size: 2em;
            font-family: 'Brush Script MT', cursive;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .welcome-message {
            margin-right: 15px;
            font-weight: bold;
        }

        .cart-container {
            display: flex;
            align-items: center;
        }

        .cart-icon {
            font-size: 1.5em;
            cursor: pointer;
        }

        .buttons button {
            margin-left: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .menu-item img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .menu-item h3 {
            margin: 10px 0;
            font-size: 1.2em;
        }

        .menu-item p {
            color: #666;
        }

        .menu-item button {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu-item button:hover {
            background-color: #218838;
        }

        .cart {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .cart h2 {
            text-align: center;
            color: #333;
        }

        .cart-items {
            list-style: none;
            padding: 0;
        }

        .cart-items li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-total {
            text-align: right;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body onload="checkLogin()">

    <div class="header">
        <div class="restaurant-name">Restaurant</div>
        <div class="user-info">
            <span class="welcome-message" id="welcome-message"></span>
            <div class="cart-container">
                <span class="cart-icon">🛒</span>
                <span id="cart-count">0</span>
                <div class="buttons">
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <h1>Restaurant Menu</h1>
    <div class="menu" id="menu"></div>

    <div class="cart" id="cart">
        <h2>Your Cart</h2>
        <ul class="cart-items" id="cart-items"></ul>
        <p class="cart-total" id="cart-total">Total: $0</p>
        <button onclick="proceedToCheckout()">Buy Now</button>
    </div>

    <script>
        const cart = [];





        function logout() {
            sessionStorage.clear(); // ✅ Clear session data on logout
            window.location.href = "customer_login.html"; // Redirect to login page
        }

        function updateCart() {
            const cartItemsContainer = document.getElementById("cart-items");
            const cartTotal = document.getElementById("cart-total");
            cartItemsContainer.innerHTML = "";
            let total = 0;

            cart.forEach((item, index) => {
                const cartItem = document.createElement("li");
                cartItem.innerHTML = `${item.name} (x${item.quantity}) - $${item.price * item.quantity} <button onclick="removeFromCart(${index})">Remove</button>`;
                cartItemsContainer.appendChild(cartItem);
                total += item.price * item.quantity;
            });

            cartTotal.textContent = `Total: $${total}`;
        }

        function addToCart(name, price) {
            // Check if the user is logged in
            if (!sessionStorage.getItem("customer")) {
                alert("Please login to continue.");
                window.location.href = "customer_login.html"; // Redirect to login
                return;  // Stop further execution
            }

            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ name, price, quantity: 1 });
            }

            updateCart();
        }


        function removeFromCart(index) {
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            } else {
                cart.splice(index, 1);
            }
            updateCart();
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            sessionStorage.setItem("cart", JSON.stringify(cart));
            window.location.href = "checkout.html";
        }

        const menuContainer = document.getElementById("menu");
        const menuItems = [
            {
                name: "Spaghetti Carbonara",
                description: "Classic Italian pasta dish with eggs, cheese, pancetta, and pepper.",
                image: "spaghetti.jpg",
                price: 12
            },
            {
                name: "Margherita Pizza",
                description: "Traditional pizza topped with fresh tomatoes, mozzarella cheese, and basil.",
                image: "pizza.jpg",
                price: 10
            },
            {
                name: "Caesar Salad",
                description: "Crisp romaine lettuce with Caesar dressing, croutons, and parmesan cheese.",
                image: "CaesarSalad.jpg",
                price: 8
            },
            {
                name: "Grilled Salmon",
                description: "Fresh salmon fillet grilled to perfection, served with lemon and herbs.",
                image: "salmon.jpg",
                price: 15
            },
            {
                name: "Chicken Biriyani",
                description: "A fragrant and flavorful rice dish made with marinated chicken, basmati rice, and a blend of aromatic spices, often garnished with fried onions, fresh herbs, and served with raita (yogurt sauce).",
                image: "Chicken_Biriyani.jpg",// Replace with your local image file name
                price: 35
            },
            {
                name: "Chicken Curry",
                description: "Spicy chicken curry cooked with aromatic spices and coconut milk.",
                image: "chicken_curry.jpg",// Replace with your local image file name,
                price: 35
            },
            {
                name: "Vegetable Stir Fry",
                description: "A mix of fresh vegetables stir-fried in a savory sauce.",
                image: "stir_fry.jpg",
                price: 20 // Replace with your local image file name
            },
            {
                name: "Chocolate Cake",
                description: "Rich and moist chocolate cake topped with creamy chocolate frosting.",
                image: "chocolate_cake.jpg",
                price: 18 // Replace with your local image file name
            },
            {
                name: "Cheeseburger",
                description: "Juicy beef patty topped with cheese, lettuce, and tomato on a toasted bun.",
                image: "cheeseburger.jpg",
                price: 22// Replace with your local image file name
            },
            {
                name: "Pancakes",
                description: "Fluffy pancakes served with maple syrup and fresh berries.",
                image: "pancakes.jpg",
                price: 15 // Replace with your local image file name
            },
            {
                name: "Shrimp Scampi",
                description: "Shrimp sautéed in garlic, butter, and white wine, served over pasta.",
                image: "shrimp_scampi.jpg",
                price: 11// Replace with your local image file name
            },
            {
                name: "Mushroom Risotto",
                description: "Creamy risotto cooked with fresh mushrooms and parmesan cheese.",
                image: "risotto.jpg",
                price: 25// Replace with your local image file name
            },
            {
                name: "Chicken 65",
                description: "A spicy, deep-fried chicken dish originating from South India, marinated in a blend of yogurt and spices, and often garnished with curry leaves and green chilies.",
                image: "chicken_65.jpg",
                price: 10
            }
        ];

        menuItems.forEach(item => {
            let menuItem = document.createElement("div");
            menuItem.classList.add("menu-item");

            menuItem.innerHTML = `
                <img src="${item.image}" alt="${item.name}">
                <h3>${item.name}</h3>
                <p>${item.description}</p>
                <p><strong>Price: $${item.price}</strong></p>
                <button onclick="addToCart('${item.name}', ${item.price})">Add to Cart</button>
            `;

            menuContainer.appendChild(menuItem);
        });
    </script>

</body>

</html>
